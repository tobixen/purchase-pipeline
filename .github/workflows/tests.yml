name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # inventory-md is a real library dependency (inventory_md.bb_dates,
      # .additem, .parser) and is not on PyPI, so CI installs it from git
      # before the editable install of this project resolves it.
      - name: Check out inventory-md
        uses: actions/checkout@v4
        with:
          repository: tobixen/inventory-md
          path: .inventory-md
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install inventory-md
        run: pip install ./.inventory-md

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      - name: Run tests
        run: pytest
